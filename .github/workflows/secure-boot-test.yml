name: Secure Boot Tests
on: [push, pull_request]

jobs:
  secure-boot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            qemu-system-x86 swtpm swtpm-tools \
            mtools efitools sbsigntool ovmf \
            systemd systemd-ukify systemd-boot-efi

      - name: Build vanguard
        run: |
          make embed
          go build -o vanguard ./cmd/vanguard/

      - name: Provision OVMF Secure Boot keys
        run: |
          sudo scripts/qemu-test.sh provision-ovmf || {
            echo "OVMF Secure Boot firmware not available - skipping"
            exit 0
          }

      - name: Build signed test UKI
        run: |
          sudo scripts/qemu-test.sh build-uki || {
            echo "UKI build failed - skipping"
            exit 0
          }

      # Resolve the OVMF paths the same way scripts/qemu-test.sh does, so the
      # CODE/VARS pair is guaranteed to match the provisioned NVRAM.
      - name: Resolve OVMF paths
        run: |
          for dir in /usr/share/edk2/OvmfX64 /usr/share/OVMF; do
            if [ -f "${dir}/OVMF_CODE.secboot.fd" ]; then
              echo "OVMF_CODE=${dir}/OVMF_CODE.secboot.fd" >> "$GITHUB_ENV"
              break
            fi
            if [ -f "${dir}/OVMF_CODE_4M.secboot.fd" ]; then
              echo "OVMF_CODE=${dir}/OVMF_CODE_4M.secboot.fd" >> "$GITHUB_ENV"
              break
            fi
          done
          if [ -z "${OVMF_CODE}" ]; then
            echo "OVMF Secure Boot firmware not found"
            exit 1
          fi
          echo "OVMF_VARS=$(dirname "${OVMF_CODE}")/$(basename "${OVMF_CODE}" | sed 's/^OVMF_CODE/OVMF_VARS/')" >> "$GITHUB_ENV"

      - name: Test unsigned UKI rejected
        run: |
          timeout 15 qemu-system-x86_64 \
            -machine q35,smm=on -m 2G -nographic -no-reboot \
            -drive if=pflash,format=raw,readonly=on,file="${OVMF_CODE}" \
            -drive if=pflash,format=raw,file=test/ovmf/OVMF_VARS.secboot.fd \
            -drive id=esp,format=raw,if=none,file=test/esp.img \
            -device ich9-ahci,id=ahci -device ide-hd,drive=esp,bus=ahci.0 \
            -serial mon:stdio 2>&1 | tee test/unsigned-boot.log
          # Hard assertion: unsigned UKI must be rejected.
          grep -q "Access Denied" test/unsigned-boot.log || {
            echo "FAIL: unsigned UKI was not rejected"
            exit 1
          }
          echo "PASS: unsigned UKI rejected"

      - name: Test signed UKI accepted
        run: |
          timeout 30 qemu-system-x86_64 \
            -machine q35,smm=on -m 2G -nographic -no-reboot \
            -drive if=pflash,format=raw,readonly=on,file="${OVMF_CODE}" \
            -drive if=pflash,format=raw,file=test/ovmf/OVMF_VARS.secboot.fd \
            -drive id=esp,format=raw,if=none,file=test/esp.img \
            -device ich9-ahci,id=ahci -device ide-hd,drive=esp,bus=ahci.0 \
            -serial mon:stdio 2>&1 | tee test/signed-boot.log
          # Hard assertion: the signed UKI must get past Secure Boot far
          # enough to boot the kernel (Access Denied means rejection).
          grep -q "Access Denied" test/signed-boot.log && {
            echo "FAIL: signed UKI was rejected"
            exit 1
          }
          echo "PASS: signed UKI accepted"