name: Unit Tests
on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      - name: Install swtpm
        run: |
          sudo apt-get update
          sudo apt-get install -y swtpm swtpm-tools
      - name: Build embed binaries
        run: make embed
      - name: Run unit tests
        env:
          CI: true
        run: go test -count=1 ./...
      - name: Run race detector
        run: go test -race -count=1 ./...
      - name: Run vet
        run: go vet ./...
      - name: Check formatting
        run: |
          FILES=$(gofmt -l $(find . -name "*.go" -not -path "./.git/*" -not -path "./testdata/*"))
          if [ -n "$FILES" ]; then
            echo "gofmt found unformatted files:"
            echo "$FILES"
            exit 1
          fi
