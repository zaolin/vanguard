name: Coverage
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            qemu-system-x86 swtpm swtpm-tools cryptsetup lvm2 \
            busybox gcc make mtools e2tools \
            efitools sbsigntool ovmf fwupd \
            systemd systemd-ukify systemd-boot-efi

      - name: Build vanguard
        run: |
          make embed
          go build -o vanguard ./cmd/vanguard/

      - name: Build covered init + C wrapper
        run: |
          CGO_ENABLED=0 go build -cover -tags debug -o test/init-cover ./init/
          gcc -static -o /tmp/init-cover-wrapper scripts/helpers/init-cover-wrapper.c

      - name: Create test disk
        run: |
          mkdir -p test
          dd if=/dev/zero of=test/test-disk.raw bs=1G count=1
          sudo scripts/helpers/create-disk.sh test/test-disk.raw testpass

      - name: Enroll TPM + generate pcrlock
        timeout-minutes: 5
        continue-on-error: true
        id: tpm_enroll
        run: |
          mkdir -p test/tpm
          # Start swtpm with both server and ctrl sockets
          swtpm socket --tpmstate dir=test/tpm \
            --server type=unixio,path=test/tpm/swtpm.sock \
            --ctrl type=unixio,path=test/tpm/swtpm.sock.ctrl \
            --tpm2 --flags startup-clear,not-need-init &
          sleep 2

          LOOP=$(sudo losetup -f --show test/test-disk.raw)
          sudo partprobe $LOOP; sleep 1
          PART="${LOOP}p2"; [ -e "$PART" ] || PART="${LOOP}p1"

          # Enroll TPM token WITHOUT PIN (non-interactive)
          echo -n "testpass" | sudo systemd-cryptenroll \
            --tpm2-device="swtpm:path=test/tpm/swtpm.sock" \
            --wipe-slot=tpm2 \
            --unlock-key-file=/dev/stdin "$PART"

          # Generate pcrlock policy
          sudo SYSTEMD_TPM2_DEVICE="swtpm:path=test/tpm/swtpm.sock" \
            /usr/lib/systemd/systemd-pcrlock make-policy \
            --policy=test/pcrlock.json --pcr=23 --force || true

          sudo pkill swtpm; sleep 1
          sudo losetup -d $LOOP

      - name: Generate initramfs
        if: steps.tpm_enroll.outcome == 'success'
        run: |
          sudo ./vanguard generate -o test/initramfs.img --debug --init-binary test/init-cover

      - name: Create cover disk
        if: steps.tpm_enroll.outcome == 'success'
        run: |
          dd if=/dev/zero of=test/cover.img bs=1M count=10
          mkfs.ext4 -q test/cover.img

      - name: Enable KVM access
        if: steps.tpm_enroll.outcome == 'success'
        run: |
          sudo chmod 666 /dev/kvm 2>/dev/null || true

      - name: Test QEMU
        if: steps.tpm_enroll.outcome == 'success'
        run: |
          echo "=== Smoke test: Kernel + initrd ==="
          timeout 60 qemu-system-x86_64 \
            -m 512M -cpu qemu64 -enable-kvm \
            -kernel testdata/kernel/bzImage \
            -initrd test/initramfs.img \
            -append "console=ttyS0 panic=1 vanguard.testmode=1" \
            -nographic -no-reboot 2>&1 | head -10 || true
          echo "=== Smoke test complete ==="

      - name: Run QEMU coverage
        if: steps.tpm_enroll.outcome == 'success'
        timeout-minutes: 5
        continue-on-error: true
        id: qemu_run
        run: |
          # Restart swtpm in ctrl-only mode for QEMU.
          # The enrollment step used two-socket mode (--server + --ctrl) because
          # systemd-cryptenroll/systemd-pcrlock use the swtpm: TCTI which talks
          # directly to the data socket. But QEMU's TPM emulator backend requires
          # the CONTROL socket for the CMD_SET_DATAFD handshake — connecting QEMU
          # to the data socket causes an indefinite hang (0 bytes of output).
          # We restart swtpm in ctrl-only mode, preserving the TPM state dir
          # (which contains the enrolled NV index), and point QEMU at the ctrl socket.
          sudo pkill swtpm 2>/dev/null; sleep 1
          rm -f test/tpm/swtpm-qemu.sock
          swtpm socket --tpmstate dir=test/tpm \
            --ctrl type=unixio,path=test/tpm/swtpm-qemu.sock \
            --tpm2 --flags startup-none,not-need-init \
            --log level=5,file=test/tpm/swtpm-qemu.log &
          sleep 2
          if [ ! -S test/tpm/swtpm-qemu.sock ]; then
            echo "ERROR: swtpm ctrl socket not created"
            cat test/tpm/swtpm-qemu.log 2>/dev/null || echo "no swtpm log"
            exit 1
          fi

          # Run QEMU with TPM device (tpm-tis, not tpm-crb — tpm-tis is the
          # documented and more broadly tested QEMU TPM frontend).
          # The init binary will find /dev/tpmrm0, proceed through the full
          # boot flow (TPM module loading, PCR 7 check, LUKS token discovery,
          # TPM unseal attempt), exercising significantly more code paths.
          timeout 120 qemu-system-x86_64 \
            -m 512M -cpu qemu64 -enable-kvm \
            -kernel testdata/kernel/bzImage \
            -initrd test/initramfs.img \
            -append "root=/dev/vg0/root console=ttyS0,115200 earlyprintk=serial vanguard.testmode=1 panic=1 GOCOVERDIR=/cover" \
            -device virtio-scsi-pci,id=scsi0 \
            -device scsi-hd,drive=hd0,bus=scsi0.0 \
            -drive file=test/test-disk.raw,format=raw,id=hd0,if=none \
            -drive id=cover,format=raw,if=none,file=test/cover.img \
            -device virtio-blk-pci,drive=cover \
            -chardev socket,id=chrtpm,path=test/tpm/swtpm-qemu.sock \
            -tpmdev emulator,id=tpm0,chardev=chrtpm \
            -device tpm-tis,tpmdev=tpm0 \
            -nographic -no-reboot 2>&1 | tee /tmp/cover-boot.log | head -500 || true

          echo "Boot log size: $(wc -c < /tmp/cover-boot.log) bytes"
          tail -30 /tmp/cover-boot.log
          cp /tmp/cover-boot.log test/cover-boot.log

          # If boot log is empty, dump swtpm log for debugging
          if [ $(wc -c < /tmp/cover-boot.log) -eq 0 ]; then
            echo "=== WARNING: Boot log is empty — QEMU may have hung on TPM handshake ==="
            echo "=== swtpm log ==="
            cat test/tpm/swtpm-qemu.log 2>/dev/null || echo "no swtpm log"
          fi

          echo "=== End of boot log ==="

      - name: Extract QEMU coverage
        if: steps.qemu_run.outcome == 'success'
        run: |
          echo "=== Cover disk contents ==="
          e2ls test/cover.img 2>&1 || echo "e2ls failed"
          echo "=== Extracting coverage files ==="
          rm -rf test/cover-data && mkdir -p test/cover-data
          for f in $(e2ls test/cover.img 2>/dev/null | grep -v lost+found | tr -d ' '); do
            echo "  copying: $f"
            e2cp "test/cover.img:/$f" "test/cover-data/$f"
          done
          echo "=== Files in cover-data ==="
          ls -la test/cover-data/ 2>&1
          if [ -n "$(ls -A test/cover-data 2>/dev/null)" ]; then
            go tool covdata textfmt -i test/cover-data -o test/qemu-cover.out
          else
            echo "No coverage files found in cover disk"
            touch test/qemu-cover.out
          fi

      - name: Install gocovmerge
        run: go install github.com/wadey/gocovmerge@latest

      - name: Run go test coverage
        env:
          CI: true
        run: go test -coverprofile=test/gotest.out ./...

      - name: Report coverage
        run: |
          echo "=== QEMU Boot Coverage ==="
          if [ -f test/qemu-cover.out ]; then
            go tool cover -func=test/qemu-cover.out | tail -1
          else
            echo "No QEMU coverage data (TPM enrollment may have failed)"
          fi
          echo "=== Go Test Coverage ==="
          go tool cover -func=test/gotest.out | tail -1

          echo "=== Combined Coverage ==="
          if [ -f test/qemu-cover.out ]; then
            $(go env GOPATH)/bin/gocovmerge test/gotest.out test/qemu-cover.out > test/combined.out
            go tool cover -func=test/combined.out | tail -1
          else
            echo "No QEMU coverage to merge"
            cp test/gotest.out test/combined.out
          fi

      - name: Check threshold
        run: |
          COMBINED_COV=$(go tool cover -func=test/combined.out | tail -1 | awk '{print $3}' | tr -d '%')
          GOTEST_COV=$(go tool cover -func=test/gotest.out | tail -1 | awk '{print $3}' | tr -d '%')
          echo "Go test coverage: ${GOTEST_COV}%"
          echo "Combined coverage: ${COMBINED_COV}%"
          if [ $(echo "${COMBINED_COV} < 34" | bc) -eq 1 ]; then
            echo "FAIL: Combined coverage ${COMBINED_COV}% < 34%"
            exit 1
          fi
          echo "Coverage check passed"

      - name: Write coverage badge data
        run: |
          COMBINED_COV=$(go tool cover -func=test/combined.out | tail -1 | awk '{print $3}' | tr -d '%')
          GOTEST_COV=$(go tool cover -func=test/gotest.out | tail -1 | awk '{print $3}' | tr -d '%')
          QEMU_COV=0
          if [ -f test/qemu-cover.out ]; then
            QEMU_COV=$(go tool cover -func=test/qemu-cover.out | tail -1 | awk '{print $3}' | tr -d '%')
          fi
          COLOR="green"
          if [ $(echo "${COMBINED_COV} < 34" | bc) -eq 1 ]; then
            COLOR="red"
          elif [ $(echo "${COMBINED_COV} < 50" | bc) -eq 1 ]; then
            COLOR="yellow"
          fi
          cat > .github/coverage.json << EOF
          {
            "schemaVersion": 1,
            "label": "coverage",
            "message": "${COMBINED_COV}%",
            "color": "${COLOR}"
          }
          EOF
          echo "Coverage badge data written: ${COMBINED_COV}% (${COLOR})"

      - name: Commit coverage data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .github/coverage.json
          git diff --staged --quiet || git commit -m "chore: update coverage badge data [skip ci]"
          git push || true

      - uses: actions/upload-artifact@v4
        with:
          name: coverage-reports
          path: |
            test/qemu-cover.out
            test/gotest.out
            test/combined.out
            /tmp/cover-boot.log

      - name: Cleanup
        if: always()
        run: pkill swtpm 2>/dev/null || true
# This is added by the edit tool
